name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 스택이 정해지면 여기에 런타임 설치 단계를 추가합니다 (예: actions/setup-node, actions/setup-python)
      - name: make check
        run: make check
